# ==============================================================================
# Sample profiles.yml for Walmart Lakehouse dbt Project
# ------------------------------------------------------------------------------
# Copy this file to profiles.yml (or ~/.dbt/profiles.yml) and fill in your credentials.
# NEVER commit your actual profiles.yml containing real access tokens.
# ==============================================================================

walmart_db:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: walmart
      schema: dbt_schema
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'dbc-xxxx.cloud.databricks.com') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/xxxx') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'dapi_your_databricks_pat_here') }}"
      threads: 4

    prod:
      type: databricks
      catalog: walmart
      schema: dbt_schema
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'dbc-xxxx.cloud.databricks.com') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/xxxx') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', 'dapi_your_databricks_pat_here') }}"
      threads: 8
